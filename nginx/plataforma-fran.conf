# Nginx config para Plataforma Fran
# Substitua SEU_DOMINIO pelo seu domínio real (ex: clinicafran.com.br)
#
# Após obter SSL com Certbot, este arquivo será editado automaticamente
# pelo certbot para adicionar o bloco HTTPS (443).

server {
    listen 80;
    server_name clinic.franhanel.com;

    # Limite de upload compatível com o app (10MB de arquivos + overhead)
    client_max_body_size 20M;

    # Logs
    access_log /var/log/nginx/plataforma-fran-access.log;
    error_log  /var/log/nginx/plataforma-fran-error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Headers necessários para Express trust proxy e sessão segura
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout generoso para respostas do LLM
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }
}
